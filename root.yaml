AWSTemplateFormatVersion: 2010-09-09

Description: Root Stack For Monitoring Project

Resources:

  VPCStack:

    Type: AWS::CloudFormation::Stack
    Properties:

      TemplateURL: https://brahma-projects-cloud-formation.s3.ap-south-2.amazonaws.com/vpc.yaml


  EC2Stack: 

    Type: AWS::CloudFormation::Stack
    Properties:

      TemplateURL: https://brahma-projects-cloud-formation.s3.ap-south-2.amazonaws.com/ec2.yaml
  
      Parameters:

        InstanceName: Monitoring-Server

        AmiId: ami-mkcakcakncak

        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnetId

        SecurityGroupId: !GetAtt VPCStack.Outputs.SecurityGroupId



  SNSStack:

    Type: AWS::CloudFormation::Stack
    Properties:

      TemplateURL: https://brahma-projects-cloud-formation.s3.ap-south-2.amazonaws.com/sns.yaml
      Parameters:

        EmailAddress: kukatla-------


  CloudWatchStack:

    Type: AWS::CloudFormation::Stack
    DependsOn:
      - EC2Stack
      - SNSStack
    Properties:

      TemplateURL: https://brahma-projects-cloud-formation.s3.ap-south-2.amazonaws.com/cloudwatch.yaml

      Parameters:
        InstanceId: !GetAtt EC2Stack.Outputs.InstanceId
        TopicArn: !GetAtt SNSStack.Outputs.TopicArn