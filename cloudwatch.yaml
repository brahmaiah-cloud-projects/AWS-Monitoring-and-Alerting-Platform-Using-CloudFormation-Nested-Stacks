AWSTemplateFormatVersion: 2010-09-09

Description: CloudWatch Alarm Stack For Monitoring

Parameters:

  InstanceId:
   Type: String

  TopicArn:
    Type: String


Resources:

  HighCPUAlarm:

    Type: AWS::CloudWatch::Alarm
    Properties:

      AlarmName: High-CPU-Alarm
      AlarmDescription: Alarm When CPU exceeds 80 percent
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      AlarmActions:
        - !Ref TopicArn



Outputs:
  AlarmName:
    Value: !Ref HighCPUAlarm